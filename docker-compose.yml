services:
  postgres:
    image: postgres:16-alpine
    container_name: streamify-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-streamify_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-streamify_password_123!}
      POSTGRES_DB: ${POSTGRES_DB:-streamify_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-streamify_user} -d ${POSTGRES_DB:-streamify_db}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: streamify-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-streamify_db};Username=${POSTGRES_USER:-streamify_user};Password=${POSTGRES_PASSWORD:-streamify_password_123!}"
      Jwt__Key: "${JWT_SECRET:-SuperSecretKeyForStreamifyJwtTokenProductionEvaluation2026!}"
      Jwt__Issuer: "${JWT_ISSUER:-streamify.api}"
      Jwt__Audience: "${JWT_AUDIENCE:-streamify.client}"
      CorsSettings__FrontendUrl: "${CORS_FRONTEND_URL:-http://localhost,http://localhost:80}"
      TMDb__ApiKey: "${TMDB_API_KEY:-}"
      TMDb__BaseUrl: "https://api.themoviedb.org/3/"
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: streamify-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
